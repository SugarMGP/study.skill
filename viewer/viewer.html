<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>课程播放器</title>
<link rel="stylesheet" href="https://unpkg.com/layui@2.13.7/dist/css/layui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-theme">
<link rel="stylesheet" href="/assets/viewer.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin viewer-shell">
  <div class="layui-header viewer-header">
    <div class="layui-logo viewer-logo">课程播放器</div>
    <div class="viewer-breadcrumb">
      <span class="layui-breadcrumb" lay-separator="/" id="breadcrumb">loading...</span>
    </div>
    <div class="viewer-header-actions">
      <span class="layui-badge-rim viewer-hidden" id="rpg-status"></span>
      <span class="layui-badge layui-bg-orange viewer-hidden" id="review-badge"></span>
      <button type="button" class="layui-btn layui-btn-primary layui-border layui-btn-sm" id="theme-btn" onclick="toggleTheme()">深色</button>
    </div>
  </div>

  <div class="layui-side viewer-side">
    <div class="layui-side-scroll">
      <div class="viewer-side-title">课程目录</div>
      <ul class="layui-nav layui-nav-tree course-nav" id="nav-list" lay-filter="course-nav">
        <li class="layui-nav-item"><a href="javascript:;">加载中...</a></li>
      </ul>
      <div class="skill-map viewer-hidden" id="skill-tree-section">
        <div class="skill-map-title">技能树</div>
        <div id="skill-tree"></div>
      </div>
    </div>
  </div>

  <div class="layui-body viewer-body">
    <main class="viewer-content" id="content">
      <div class="layui-card viewer-card"><div class="layui-card-body loading">加载课程内容...</div></div>
    </main>
  </div>

  <aside class="viewer-aside">
    <div class="layui-card viewer-card viewer-overview-card">
      <div class="layui-card-header">学习概览</div>
      <div class="layui-card-body" id="learning-overview"><div class="loading">加载中...</div></div>
    </div>
    <div class="layui-card viewer-card viewer-panel-card">
      <div class="layui-card-header">待问清单</div>
      <div class="layui-card-body">
        <div id="question-list"></div>
        <div class="layui-form viewer-stack-md">
          <div class="layui-input-group">
            <input type="text" id="question-input" placeholder="输入问题..." class="layui-input">
            <div class="layui-input-suffix">
              <button type="button" class="layui-btn layui-btn-sm" onclick="addQuestion()">添加</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="layui-card viewer-card viewer-panel-card">
      <div class="layui-card-header">本课程待复习</div>
      <div class="layui-card-body" id="review-panel"><div class="loading">加载中...</div></div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/layui@2.13.7/dist/layui.js" onload="this.dataset.loaded='true'" onerror="window.__layuiLoadError=true"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/assets/viewer.js"></script>
</body>
</html>
